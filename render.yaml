services:
  - type: web
    name: ansumana-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn "app:create_app()"
    healthCheckPath: /api/health/ready
    envVars:
      - key: FLASK_ENV
        value: production
      - key: PYTHON_VERSION
        value: "3.13"
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: ansumana-db
          property: connectionString
      - key: CORS_ORIGINS
        sync: false
      - key: FRONTEND_BASE_URL
        sync: false
      - key: AEC_ADMIN_PASSWORD
        sync: false
      - key: UPLOAD_DIR
        value: /var/data/uploads
      - key: EMAIL_ENABLED
        value: "false"
      - key: WHATSAPP_ENABLED
        value: "false"
      - key: RATELIMIT_STORAGE_URI
        value: "memory://"

  - type: cron
    name: ansumana-reminders
    runtime: python
    plan: starter
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: flask --app app run-reminders
    schedule: "0 8 * * *"
    envVars:
      - key: FLASK_ENV
        value: production
      - key: PYTHON_VERSION
        value: "3.13"
      - key: DATABASE_URL
        fromDatabase:
          name: ansumana-db
          property: connectionString
      - key: SECRET_KEY
        fromService:
          name: ansumana-backend
          type: web
          envVarKey: SECRET_KEY
      - key: JWT_SECRET_KEY
        fromService:
          name: ansumana-backend
          type: web
          envVarKey: JWT_SECRET_KEY

databases:
  - name: ansumana-db
    plan: free
    databaseName: ansumana_compliance
    ipAllowList: []
